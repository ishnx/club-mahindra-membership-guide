const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const raw=b64(DATA);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return new TextDecoder().decode(pt);
}
async function go(){
  const btn=document.getElementById('go');btn.disabled=true;document.getElementById('err').style.display='none';
  try{
    const html=await unlock(document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('err').style.display='block';btn.disabled=false;}
}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
